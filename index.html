<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />

    <!-- ================================================================
         SOCIAL SHARING METADATA
         WhatsApp, Facebook and iMessage read these tags straight out of
         this file — they never run the app's JavaScript. That is why every
         invitation link used to preview as the same girl.

         For /i/<slug> and /c/<code>, the edge function at
         netlify/edge-functions/social-preview.ts REPLACES everything
         between the two SOCIAL markers below with tags for that actual
         invitation, before the crawler sees the page. Keep the markers.

         What is written here is only the fallback: the root page, the
         marketing page, and anything the edge function cannot identify.
         ================================================================ -->
    <!--SOCIAL:START-->
    <title>Quinceañera Cruises | Happy Holidays Travel</title>
    <meta
      name="description"
      content="Celebrate a quinceañera at sea with Happy Holidays Travel. Cruise details, cabin prices and reservations for our 2027 group sailings."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Quinceañera Cruises | Happy Holidays Travel" />
    <meta
      property="og:description"
      content="Celebrate a quinceañera at sea with Happy Holidays Travel. Cruise details, cabin prices and reservations for our 2027 group sailings."
    />
    <meta property="og:image" content="https://hht-quince-invitation.netlify.app/images/icon-share.jpg" />
    <meta property="og:url" content="https://hht-quince-invitation.netlify.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quinceañera Cruises | Happy Holidays Travel" />
    <meta
      name="twitter:description"
      content="Celebrate a quinceañera at sea with Happy Holidays Travel. Cruise details, cabin prices and reservations for our 2027 group sailings."
    />
    <meta name="twitter:image" content="https://hht-quince-invitation.netlify.app/images/icon-share.jpg" />
    <!--SOCIAL:END-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- The guest interest form does NOT use Netlify Forms (form detection
         is off across the HHT sites). It posts to the shared quince-request
         function, so leads land in the same quince_leads pipeline as every
         other source. See src/lib/quinceLeads.ts. -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
