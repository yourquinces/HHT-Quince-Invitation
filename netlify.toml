# Netlify configuration for the HHT Quinceañera Cruise Invitation.
# Deploy: connect this repo to Netlify (or drag-and-drop the dist folder).

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Per-invitation link previews for WhatsApp and friends. See
  # netlify/edge-functions/social-preview.ts — it rewrites the social meta
  # block on /i/* and /c/* before the crawler sees the page.
  edge_functions = "netlify/edge-functions"

# Functions must resolve before the catch-all SPA redirect below.
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single-page-app redirect so all routes serve the React app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
